      <circle cx="59.5" cy="30" r="15" fill="#194b58" stroke="#8de4d4"/>
      <path d="m52 30 5 5 10-11" fill="none" stroke="#a4efdf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="59.5" y="69" fill="#f2f7fa" font-size="16" font-weight="650">Review</text>
      <text x="59.5" y="93" fill="#b8c8d4" font-size="12">Verify · refine</text>
    </g>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="2" marker-end="url(#arrow)">
    <path d="M268 283h34"/><path d="M501 283h34"/><path d="M734 283h34"/><path d="M967 283h34"/><path d="M1200 283h34"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="78" y="380" width="1284" height="66" rx="15" fill="#102333" stroke="#2d5364"/>
    <text x="104" y="408" fill="#8de4d4" font-size="13" font-weight="700" letter-spacing="1.8">SUPPORTING EVERY STAGE</text>
    <text x="104" y="431" fill="#d9e3e9" font-size="15">968 skill and reference entries</text>
    <path d="M440 397v31" stroke="#365567"/>
    <text x="470" y="408" fill="#8de4d4" font-size="13" font-weight="700" letter-spacing="1.8">AUTOMATIC SKILL ROUTING</text>
    <text x="470" y="431" fill="#d9e3e9" font-size="15">Methods and domain references loaded when relevant</text>
    <path d="M964 397v31" stroke="#365567"/>
    <text x="994" y="408" fill="#8de4d4" font-size="13" font-weight="700" letter-spacing="1.8">RESEARCH INTEGRITY</text>
    <text x="994" y="431" fill="#d9e3e9" font-size="15">Evidence · provenance · reproducibility</text>
  </g>
