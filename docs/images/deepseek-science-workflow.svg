<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Science research workflow</title>
  <desc id="desc">A local research workspace connects literature discovery, study design, analysis and figures, LaTeX writing, and review. Domain-aware skills and research integrity checks support each stage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#12283a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#73e0cc"/>
      <stop offset="1" stop-color="#73b8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020611" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#6dbfc8"/>
    </marker>
  </defs>
  <rect width="1440" height="500" rx="28" fill="url(#bg)"/>
  <circle cx="1310" cy="58" r="160" fill="#153e50" opacity=".24"/>
  <circle cx="85" cy="470" r="180" fill="#183d50" opacity=".18"/>
  <path d="M0 396C245 350 408 473 683 417s425-43 757 15" fill="none" stroke="#346879" stroke-opacity=".22" stroke-width="2"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="78" y="86" fill="#8de4d4" font-size="15" font-weight="700" letter-spacing="3.4">DEEPSEEK SCIENCE</text>
    <text x="78" y="142" fill="#f3f7fb" font-size="38" font-weight="650">From research question to a reviewable paper</text>
    <text x="80" y="177" fill="#aebdcb" font-size="17">A local desktop workspace with configurable models and discipline-aware methods.</text>
  </g>
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(78 226)">
      <rect width="184" height="114" rx="17" fill="#172a3d" stroke="#37566a"/>
      <circle cx="92" cy="30" r="15" fill="#183f4c" stroke="#7ce0cf"/>
      <path d="M84 30h16M92 22v16" stroke="#9cebdc" stroke-width="2"/>
      <text x="92" y="69" fill="#f2f7fa" font-size="17" font-weight="650">Research question</text>
      <text x="92" y="93" fill="#aab9c8" font-size="13">Scope · hypothesis · novelty</text>
    </g>
    <g transform="translate(311 226)">
      <rect width="184" height="114" rx="17" fill="#172a3d" stroke="#37566a"/>
      <circle cx="92" cy="30" r="15" fill="#183f4c" stroke="#7ce0cf"/>
      <circle cx="88" cy="28" r="5" fill="none" stroke="#9cebdc" stroke-width="2"/><path d="m92 32 5 5" stroke="#9cebdc" stroke-width="2"/>
      <text x="92" y="69" fill="#f2f7fa" font-size="17" font-weight="650">Literature</text>
      <text x="92" y="93" fill="#aab9c8" font-size="13">Search · screen · synthesize</text>
    </g>
    <g transform="translate(544 226)">
      <rect width="184" height="114" rx="17" fill="#172a3d" stroke="#37566a"/>
      <circle cx="92" cy="30" r="15" fill="#183f4c" stroke="#7ce0cf"/>
      <path d="M83 34h18M86 27h12M89 21h6" stroke="#9cebdc" stroke-width="2" stroke-linecap="round"/>
      <text x="92" y="69" fill="#f2f7fa" font-size="17" font-weight="650">Study &amp; data</text>
      <text x="92" y="93" fill="#aab9c8" font-size="13">Design · record · reproduce</text>
    </g>
    <g transform="translate(777 226)">
      <rect width="184" height="114" rx="17" fill="#172a3d" stroke="#37566a"/>
      <circle cx="92" cy="30" r="15" fill="#183f4c" stroke="#7ce0cf"/>
      <path d="M83 36V25M92 36V20M101 36V28" stroke="#9cebdc" stroke-width="3" stroke-linecap="round"/>
      <text x="92" y="69" fill="#f2f7fa" font-size="17" font-weight="650">Analysis &amp; figures</text>
      <text x="92" y="93" fill="#aab9c8" font-size="13">Statistics · vector graphics</text>
    </g>
    <g transform="translate(1010 226)">
      <rect width="184" height="114" rx="17" fill="#172a3d" stroke="#37566a"/>
      <circle cx="92" cy="30" r="15" fill="#183f4c" stroke="#7ce0cf"/>
      <path d="M85 22h10l5 5v12H85zM95 22v6h5M88 32h9M88 36h9" fill="none" stroke="#9cebdc" stroke-width="1.8"/>
